name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          APP_PATH: ${{ vars.APP_PATH }}
          GIT_REMOTE: ${{ vars.GIT_REMOTE || 'upstream2' }}
          DEPLOY_BRANCH: master
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NITRO_PORT: ${{ vars.NITRO_PORT }}
        run: |
          ssh -i ~/.ssh/server_key -o IdentitiesOnly=yes -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "APP_PATH='$APP_PATH' GIT_REMOTE='$GIT_REMOTE' DEPLOY_BRANCH='$DEPLOY_BRANCH' PM2_APP_NAME='$PM2_APP_NAME' NUXT_PUBLIC_SITE_URL='$NUXT_PUBLIC_SITE_URL' NITRO_PORT='$NITRO_PORT' bash -se" <<'EOF'
          set -euo pipefail

          cd "$APP_PATH"
          git fetch "$GIT_REMOTE"
          git reset --hard "$GIT_REMOTE/$DEPLOY_BRANCH"
          npm ci
          npm run build
          NUXT_PUBLIC_SITE_URL="$NUXT_PUBLIC_SITE_URL" NITRO_PORT="$NITRO_PORT" PORT="$NITRO_PORT" pm2 restart "$PM2_APP_NAME" --update-env
          pm2 save
          EOF
